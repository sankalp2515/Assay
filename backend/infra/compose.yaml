# Local production-PostgreSQL topology. Run provision-compose.ts first, then:
#   docker compose --env-file .local/compose.env -f infra/compose.yaml up --build -d
# Each service has a distinct physical database container and login.
name: paid-video-delivery
x-common: &common
  build: { context: .., target: runtime }
  healthcheck:
    test:
      [
        CMD,
        node,
        -e,
        "fetch('http://127.0.0.1:'+process.env.PORT+'/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
      ]
    interval: 10s
    timeout: 3s
    start_period: 20s
    retries: 5
  read_only: true
  tmpfs: ["/tmp:size=64m"]
  init: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  stop_grace_period: 310s
x-env: &environment
  HOST: 0.0.0.0
  AUTO_MIGRATE: "false"
  PUBLIC_KEYS: ${PUBLIC_KEYS:?Run provision-compose.ts}
  TENANT_IDS: ${TENANT_ID:?Run provision-compose.ts}
  MERCHANT_TENANT_ID: ${TENANT_ID}
  SERVICE_URLS: '{"commerce":"http://commerce:4100","provider":"http://provider:4101","delivery":"http://delivery:4102","investigation":"http://investigation:4103","payments":"http://payments:4104"}'
services:
  commerce-db:
    image: postgres:18-bookworm
    environment:
      { POSTGRES_PASSWORD: "${COMMERCE_DB_PASSWORD}", POSTGRES_DB: commerce }
    volumes:
      [
        "commerce-db:/var/lib/postgresql",
        "../.local/init/commerce.sql:/docker-entrypoint-initdb.d/001.sql:ro",
      ]
    healthcheck:
      {
        test: [CMD-SHELL, "pg_isready -U postgres -d commerce"],
        interval: 5s,
        retries: 12,
      }
  provider-db:
    image: postgres:18-bookworm
    environment:
      { POSTGRES_PASSWORD: "${PROVIDER_DB_PASSWORD}", POSTGRES_DB: provider }
    volumes:
      [
        "provider-db:/var/lib/postgresql",
        "../.local/init/provider.sql:/docker-entrypoint-initdb.d/001.sql:ro",
      ]
    healthcheck:
      {
        test: [CMD-SHELL, "pg_isready -U postgres -d provider"],
        interval: 5s,
        retries: 12,
      }
  delivery-db:
    image: postgres:18-bookworm
    environment:
      { POSTGRES_PASSWORD: "${DELIVERY_DB_PASSWORD}", POSTGRES_DB: delivery }
    volumes:
      [
        "delivery-db:/var/lib/postgresql",
        "../.local/init/delivery.sql:/docker-entrypoint-initdb.d/001.sql:ro",
      ]
    healthcheck:
      {
        test: [CMD-SHELL, "pg_isready -U postgres -d delivery"],
        interval: 5s,
        retries: 12,
      }
  investigation-db:
    image: postgres:18-bookworm
    environment:
      {
        POSTGRES_PASSWORD: "${INVESTIGATION_DB_PASSWORD}",
        POSTGRES_DB: investigation,
      }
    volumes:
      [
        "investigation-db:/var/lib/postgresql",
        "../.local/init/investigation.sql:/docker-entrypoint-initdb.d/001.sql:ro",
      ]
    healthcheck:
      {
        test: [CMD-SHELL, "pg_isready -U postgres -d investigation"],
        interval: 5s,
        retries: 12,
      }
  payments-db:
    image: postgres:18-bookworm
    environment:
      { POSTGRES_PASSWORD: "${PAYMENTS_DB_PASSWORD}", POSTGRES_DB: payments }
    volumes:
      [
        "payments-db:/var/lib/postgresql",
        "../.local/init/payments.sql:/docker-entrypoint-initdb.d/001.sql:ro",
      ]
    healthcheck:
      {
        test: [CMD-SHELL, "pg_isready -U postgres -d payments"],
        interval: 5s,
        retries: 12,
      }
  commerce:
    <<: *common
    environment:
      <<: *environment
      SERVICE_NAME: commerce
      PORT: "4100"
      PROVIDER_RERENDER_COST_MINOR: ${PROVIDER_RERENDER_COST_MINOR:-0}
      APPROVAL_WINDOW_SECONDS: ${APPROVAL_WINDOW_SECONDS:-45}
      BUYER_RETURN_BASE: ${BUYER_RETURN_BASE:-}
      AUTO_ARCHIVE_TASKS: ${AUTO_ARCHIVE_TASKS:-true}
      MERCHANT_WEBHOOK_URL: ${MERCHANT_WEBHOOK_URL:-}
      MERCHANT_WEBHOOK_SECRET: ${MERCHANT_WEBHOOK_SECRET:-}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      SIGNUP_MODE: ${SIGNUP_MODE:-closed}
      SIGNUP_INVITE_CODE: ${SIGNUP_INVITE_CODE:-}
      SERVICE_PRIVATE_KEY: ${COMMERCE_PRIVATE_KEY}
      DATABASE_URL: postgresql://runtime:${COMMERCE_RUNTIME_PASSWORD}@commerce-db/commerce
    ports: ["127.0.0.1:${COMMERCE_HOST_PORT:-4100}:4100"]
    depends_on: { commerce-db: { condition: service_healthy } }
  provider:
    <<: *common
    environment:
      <<: *environment
      SERVICE_NAME: provider
      PORT: "4101"
      SERVICE_PRIVATE_KEY: ${PROVIDER_PRIVATE_KEY}
      DATABASE_URL: postgresql://runtime:${PROVIDER_RUNTIME_PASSWORD}@provider-db/provider
      RUNWAY_API_KEY: ${RUNWAY_API_KEY:-}
      RUNWAY_MODEL: ${RUNWAY_MODEL:-gen4.5}
      REPLICATE_API_TOKEN: ${REPLICATE_API_TOKEN:-}
      REPORTED_OUTPUT_HOSTS: ${REPORTED_OUTPUT_HOSTS:-}
      ALLOW_PAID_INFERENCE: "false"
    depends_on: { provider-db: { condition: service_healthy } }
  delivery:
    <<: *common
    environment:
      <<: *environment
      SERVICE_NAME: delivery
      PORT: "4102"
      SERVICE_PRIVATE_KEY: ${DELIVERY_PRIVATE_KEY}
      DATABASE_URL: postgresql://runtime:${DELIVERY_RUNTIME_PASSWORD}@delivery-db/delivery
      RUNWAY_ALLOWED_HOSTS: ${RUNWAY_ALLOWED_HOSTS:-dnznrvs05pmza.cloudfront.net}
      REPLICATE_ALLOWED_HOSTS: ${REPLICATE_ALLOWED_HOSTS:-replicate.delivery}
      REPORTED_OUTPUT_HOSTS: ${REPORTED_OUTPUT_HOSTS:-}
      MEDIA_VERIFIER_URL: http://verifier:4105
      MEDIA_VERIFIER_TOKEN: ${MEDIA_VERIFIER_TOKEN}
      ARTIFACT_STORE: ${ARTIFACT_STORE:-local}
      GCS_BUCKET: ${GCS_BUCKET:-}
      GCS_PREFIX: ${GCS_PREFIX:-artifacts/}
    networks: [default, verifier-net]
    volumes: ["artifacts:/app/artifacts"]
    ports: ["127.0.0.1:${DELIVERY_HOST_PORT:-4102}:4102"]
    mem_limit: 512m
    cpus: 1
    pids_limit: 64
    depends_on: { delivery-db: { condition: service_healthy } }
  verifier:
    <<: *common
    command: [node, dist/src/verifier.js]
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:4105/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
    environment:
      HOST: 0.0.0.0
      PORT: "4105"
      MEDIA_VERIFIER_TOKEN: ${MEDIA_VERIFIER_TOKEN}
    networks: [verifier-net]
    mem_limit: 384m
    cpus: 1
    pids_limit: 32
  investigation:
    <<: *common
    environment:
      <<: *environment
      SERVICE_NAME: investigation
      PORT: "4103"
      MAX_AI_ASSESSMENTS_PER_DAY: ${MAX_AI_ASSESSMENTS_PER_DAY:-50}
      SERVICE_PRIVATE_KEY: ${INVESTIGATION_PRIVATE_KEY}
      DATABASE_URL: postgresql://runtime:${INVESTIGATION_RUNTIME_PASSWORD}@investigation-db/investigation
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      AI_ZERO_COST_ONLY: ${AI_ZERO_COST_ONLY:-true}
      AI_FALLBACK_PROVIDERS: ${AI_FALLBACK_PROVIDERS:-groq,nvidia}
      GEMINI_FREE_TIER_CONFIRMED: ${GEMINI_FREE_TIER_CONFIRMED:-false}
      GROQ_FREE_TIER_CONFIRMED: ${GROQ_FREE_TIER_CONFIRMED:-false}
      NVIDIA_FREE_TIER_CONFIRMED: ${NVIDIA_FREE_TIER_CONFIRMED:-false}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_MODEL: ${NVIDIA_MODEL:-nvidia/nemotron-3.5-super-vl-120b-a12b}
      AI_PRIMARY: ${AI_PRIMARY:-gemini}
      VERTEX_PROJECT: ${VERTEX_PROJECT:-}
      VERTEX_LOCATION: ${VERTEX_LOCATION:-global}
      VERTEX_MODEL: ${VERTEX_MODEL:-}
      VERTEX_CREDITS_CONFIRMED: ${VERTEX_CREDITS_CONFIRMED:-false}
    depends_on: { investigation-db: { condition: service_healthy } }
  payments:
    <<: *common
    environment:
      <<: *environment
      SERVICE_NAME: payments
      PORT: "4104"
      SERVICE_PRIVATE_KEY: ${PAYMENTS_PRIVATE_KEY}
      DATABASE_URL: postgresql://runtime:${PAYMENTS_RUNTIME_PASSWORD}@payments-db/payments
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_MERCHANT_ID: ${PAYPAL_MERCHANT_ID:-}
      PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID:-}
      PAYPAL_RETURN_URL: ${PAYPAL_RETURN_URL:-http://localhost:4100/v1/paypal/return}
      PAYPAL_CANCEL_URL: ${PAYPAL_CANCEL_URL:-http://localhost:4100/v1/paypal/cancel}
      PAYPAL_PARTNER_MODE: ${PAYPAL_PARTNER_MODE:-false}
      PAYPAL_PARTNER_ATTRIBUTION_ID: ${PAYPAL_PARTNER_ATTRIBUTION_ID:-}
    ports: ["127.0.0.1:${PAYMENTS_HOST_PORT:-4104}:4104"]
    depends_on: { payments-db: { condition: service_healthy } }
volumes:
  commerce-db:
  provider-db:
  delivery-db:
  investigation-db:
  payments-db:
  artifacts:
# Fixed, overridable subnets: hosts with many Docker projects can exhaust the default
# address pools ("all predefined address pools have been fully subnetted").
networks:
  default:
    ipam:
      config: [{ subnet: "${PVD_SUBNET:-10.77.10.0/24}" }]
  verifier-net:
    internal: true
    ipam:
      config: [{ subnet: "${PVD_VERIFIER_SUBNET:-10.77.11.0/28}" }]
