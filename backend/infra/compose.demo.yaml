# Judge walkthrough in one container. Needs only Docker: no keys, no database, no network.
#   docker compose -f infra/compose.demo.yaml run --rm demo
name: paid-video-delivery-demo
services:
  demo:
    build: { context: .., target: demo }
    read_only: true
    tmpfs: ["/tmp:size=256m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    network_mode: none
    environment:
      PROVIDER_RERENDER_COST_MINOR: "40"
